name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository: no job needs to write anything back.
permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a moving tag: a retagged release
      # would otherwise run arbitrary code in this workflow.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests/unit -q

  seam2:
    name: Seam 2 (kind)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Create the kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          cluster_name: provisioner-test
          wait: 120s
      - name: Show the cluster
        run: kubectl get nodes
      # The bench builds the stub agent image and loads it into kind itself;
      # the operator runs inside the test process. See tests/seam2/conftest.py.
      - name: Seam 2 tests
        env:
          PROVISIONER_TEST_CONTEXT: kind-provisioner-test
        run: uv run pytest tests/seam2 -q
      - name: Operator logs on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
